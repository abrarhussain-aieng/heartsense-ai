name: Deploy to AWS EC2

on:
  push:
    branches: [ "main" ]

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION, ECR_REGISTRY, ECR_REPOSITORY
          script: |
            set -e
            
            # 1. FORCE KILL ALL CONTAINERS to free up ports
            docker kill $(docker ps -q) || true
            docker rm $(docker ps -a -q) || true

            # 2. Clean up unused Docker data
            docker system prune -af --volumes

            # 3. Create the shared Docker network
            docker network create heartsense-net || true

            # 4. Authenticate Docker with ECR
            aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            # 5. Pull the latest image
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest

            # 6. FIX PERMISSIONS: Ensure host directories match container UID (1000)
            sudo rm -rf /home/ubuntu/chroma
            mkdir -p /home/ubuntu/chroma
            mkdir -p /home/ubuntu/artifacts
            
            # Change ownership to UID 1000, which is the standard for 'appuser' in Docker
            sudo chown -R 1000:1000 /home/ubuntu/chroma
            sudo chown -R 1000:1000 /home/ubuntu/artifacts

            # 7. Start the API container (WITH chroma volume mount)
            docker run -d \
              --name heartsense-api \
              --network heartsense-net \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file /home/ubuntu/.env \
              -v /home/ubuntu/artifacts:/app/artifacts \
              -v /home/ubuntu/chroma:/app/chroma \
              -v /home/ubuntu/firebase-service-account.json:/app/firebase-service-account.json \
              $ECR_REGISTRY/$ECR_REPOSITORY:latest

            # 8. BUILD THE DATABASE ON THE SERVER (Run as root to avoid permission errors)
            docker exec -u root heartsense-api python src/heartsense/rag/ingest.py

            # 9. Start the MCP container (WITH chroma volume mount)
            docker run -d \
              --name mcp \
              --network heartsense-net \
              --restart unless-stopped \
              -p 8001:8001 \
              --env-file /home/ubuntu/.env \
              -v /home/ubuntu/artifacts:/app/artifacts \
              -v /home/ubuntu/chroma:/app/chroma \
              $ECR_REGISTRY/$ECR_REPOSITORY:latest python -m mcp_server.server