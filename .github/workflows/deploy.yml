    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION, ECR_REGISTRY, ECR_REPOSITORY
        script: |
          # 1. Stop and remove old containers
          docker stop heartsense-api heartsense-mcp || true
          docker rm heartsense-api heartsense-mcp || true
          
          # 2. CRITICAL: Clean up unused Docker data to free space BEFORE pulling
          docker system prune -af --volumes
          
          # 3. Authenticate Docker with ECR
          aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # 4. Pull the latest image
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          # 5. Start the API container
          docker run -d \
            --name heartsense-api \
            --restart unless-stopped \
            -p 80:8000 \
            --env-file /home/ubuntu/.env \
            -v /home/ubuntu/artifacts:/app/artifacts \
            -v /home/ubuntu/chroma:/app/chroma \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest
            
          # 6. Start the MCP container
          docker run -d \
            --name heartsense-mcp \
            --restart unless-stopped \
            -p 8001:8001 \
            --env-file /home/ubuntu/.env \
            -v /home/ubuntu/artifacts:/app/artifacts \
            -v /home/ubuntu/chroma:/app/chroma \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest python -m mcp_server.server