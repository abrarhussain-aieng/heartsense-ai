    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION, ECR_REGISTRY, ECR_REPOSITORY
        script: |
          # 1. Create the docker-compose.prod.yml file on the server
          cat > /home/ubuntu/docker-compose.prod.yml << 'EOF'
          services:
            api:
              image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest
              container_name: heartsense-api
              ports:
                - "80:8000"
              env_file:
                - .env
              volumes:
                - ./artifacts:/app/artifacts
                - ./chroma:/app/chroma
              depends_on:
                - mcp
              restart: unless-stopped

            mcp:
              image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest
              container_name: heartsense-mcp
              command: python -m mcp_server.server
              ports:
                - "8001:8001"
              env_file:
                - .env
              volumes:
                - ./artifacts:/app/artifacts
                - ./chroma:/app/chroma
              restart: unless-stopped
          EOF

          # 2. Login to ECR and pull the latest image
          aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # 3. Restart the services
          cd /home/ubuntu
          docker compose -f docker-compose.prod.yml down || true
          docker compose -f docker-compose.prod.yml up -d