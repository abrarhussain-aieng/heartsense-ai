services:
  api:
    image: ${ECR_IMAGE}
    container_name: heartsense-api
    ports:
      - "80:8000"
    env_file:
      - .env
    volumes:
      - ./artifacts:/app/artifacts
      - ./chroma:/app/chroma
    depends_on:
      - mcp
    restart: unless-stopped

  mcp:
    image: ${ECR_IMAGE}
    container_name: heartsense-mcp
    command: python -m mcp_server.server
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./artifacts:/app/artifacts
      - ./chroma:/app/chroma
    restart: unless-stopped